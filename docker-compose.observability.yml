# Stack d'observabilité AFI (Prometheus + Grafana)
# Usage : docker compose -f docker-compose.observability.yml up -d
#         API : http://localhost:8000/metrics | Prometheus : :9090 | Grafana : :3000 (admin/admin)

services:
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: afi-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - afi

  grafana:
    image: grafana/grafana:10.2.0
    container_name: afi-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - afi

networks:
  afi:
    name: afi_observability