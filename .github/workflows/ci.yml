name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  # ---- Analyse statique : ruff + bandit (SAST) ----
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: SAST (bandit)
        run: bandit -r app -q

      - name: Import check
        run: python -c "import app.main"

  # ---- Tests unitaires (SQLite) ----
  unit-tests:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/unit -q

  # ---- Tests d'intégration et e2e (PostgreSQL réel) ----
  integration-e2e-tests:
    runs-on: ubuntu-latest
    needs: static-analysis
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: afi
          POSTGRES_PASSWORD: password
          POSTGRES_DB: afi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests intégration + e2e
        env:
          AFI_TEST_POSTGRES: "1"
          DATABASE_URL: postgresql://afi:password@localhost:5432/afi_test
        run: pytest tests/integration tests/e2e -q

  # ---- Build image + scans + DAST (ZAP baseline) ----
  build-and-dast:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-e2e-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build image
        run: docker build --build-arg INSTALL_OCR=false -t afi-backend:ci .

      - name: Scan image (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.50.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 afi-backend:ci

      - name: Start API
        run: docker run -d --name afi-dast -e DATABASE_URL=sqlite:///./dast.db -e SECRET_KEY=dast-secret -p 8000:8000 afi-backend:ci

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done

      - name: DAST - OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8000