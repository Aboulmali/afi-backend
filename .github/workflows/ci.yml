name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests unitaires
        run: pytest tests/unit -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (sans OCR, léger)
        run: docker build --build-arg INSTALL_OCR=false -t afi-backend:ci .

      - name: Smoke test
        run: docker run --rm -e DATABASE_URL=sqlite:///./smoke.db afi-backend:ci python -c "import app.main; print('API OK')"