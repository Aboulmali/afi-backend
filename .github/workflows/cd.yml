name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---- b/c. Conteneurisation + push image (GitHub Container Registry) ----
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_OCR=false

  # ---- f. Qualimétrie SonarQube (SonarCloud) ----
  sonar:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests avec couverture
        run: pytest tests/unit -q --cov=app --cov-report=xml
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ---- h. Déploiement automatisé sur Kubernetes ----
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        if: ${{ env.KUBE_B64 != '' }}
        env:
          KUBE_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        if: ${{ env.KUBE_B64 != '' }}
        env:
          KUBE_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_B64" | base64 -d > $HOME/.kube/config

      - name: Apply manifests (kustomize)
        if: ${{ env.KUBE_B64 != '' }}
        env:
          KUBE_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: kubectl apply -k k8s/overlays/prod

      - name: Rollout status
        if: ${{ env.KUBE_B64 != '' }}
        env:
          KUBE_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: kubectl rollout status deployment/afi-api -n afi --timeout=180s