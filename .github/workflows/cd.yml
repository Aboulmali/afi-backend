name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---- b/c. Conteneurisation + push image (GitHub Container Registry) ----
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            INSTALL_OCR=false

  # ---- f. Qualimétrie SonarQube (SonarCloud) ----
  sonar:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests avec couverture
        run: pytest tests/unit -q --cov=app --cov-report=xml
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate bloquant (SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          task_url="$(sed -n 's/^ceTaskUrl=\(.*\)/\1/p' .scannerwork/report-task.txt)"
          server_url="$(sed -n 's/^serverUrl=\(.*\)/\1/p' .scannerwork/report-task.txt)"
          dashboard_url="$(sed -n 's/^dashboardUrl=\(.*\)/\1/p' .scannerwork/report-task.txt)"
          fetch() { curl -s --fail --retry 10 --retry-all-errors --retry-delay 3 --max-time 30 -u "${SONAR_TOKEN}:" "$1"; }
          task="$(fetch "$task_url")"
          for i in $(seq 1 20); do
            status="$(jq -r '.task.status' <<< "$task")"
            [ "$status" = "PENDING" ] || [ "$status" = "IN_PROGRESS" ] || break
            echo "Analyse en cours ($status), attente..."
            sleep 5
            task="$(fetch "$task_url")"
          done
          echo "Analyse SonarCloud: $status"
          [ "$status" = "SUCCESS" ] || { echo "Echec analyse: $(jq -r '.task.errorMessage // "inconnu"' <<< "$task")" >&2; exit 1; }
          analysis_id="$(jq -r '.task.analysisId' <<< "$task")"
          gate="$(fetch "$server_url/api/qualitygates/project_status?analysisId=$analysis_id" | jq -r '.projectStatus.status')"
          echo "Quality Gate: $gate"
          echo "Detail: $dashboard_url"
          [ "$gate" = "OK" ] || { echo "QUALITY GATE FAILED" >&2; exit 1; }

  # ---- h. Déploiement automatisé sur Kubernetes ----
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl
        if: ${{ env.KUBE_B64 != '' }}
        env:
          KUBE_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        uses: azure/setup-kubectl@v5

      - name: Configure kubeconfig
        if: ${{ env.KUBE_B64 != '' }}
        env:
          KUBE_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_B64" | base64 -d > $HOME/.kube/config

      - name: Apply manifests (kustomize)
        if: ${{ env.KUBE_B64 != '' }}
        env:
          KUBE_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: kubectl apply -k k8s/overlays/prod

      - name: Rollout status
        if: ${{ env.KUBE_B64 != '' }}
        env:
          KUBE_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: kubectl rollout status deployment/afi-api -n afi --timeout=180s