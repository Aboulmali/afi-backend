global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "afi-alerts@example.com"
  smtp_require_tls: true

route:
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "email"

receivers:
  - name: "email"
    email_configs:
      - to: "afi-alerts@example.com"
