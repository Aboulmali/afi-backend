apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: afi

resources:
  - manifests/namespace.yaml
  - manifests/prometheus.yaml
  - manifests/grafana.yaml
  - manifests/loki.yaml
  - manifests/alertmanager.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=configs/prometheus.yml
      - alert-rules.yml=configs/alert-rules.yml
  - name: grafana-datasources
    files:
      - prometheus.yml=configs/grafana/datasources.yml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yml=configs/grafana/dashboards.yml
  - name: grafana-dashboards
    files:
      - afi-overview.json=configs/grafana/afi-overview.json
  - name: loki-config
    files:
      - loki.yaml=configs/loki.yml
  - name: alertmanager-config
    files:
      - alertmanager.yml=configs/alertmanager.yml