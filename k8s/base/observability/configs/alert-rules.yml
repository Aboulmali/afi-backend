groups:
  - name: afi-api
    rules:
      - alert: AFI_API_Down
        expr: up{job="afi-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AFI API inaccessible"
          description: "Le job {{ $labels.job }} ne répond plus depuis plus de 2 minutes."

      - alert: AFI_HighErrorRate
        expr: sum by (job) (rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum by (job) (rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreurs 5xx élevé"
          description: "Le taux d'erreurs 5xx est supérieur à 5% sur les 5 dernières minutes ({{ $value | humanizePercentage }})."

      - alert: AFI_HighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latence élevée"
          description: "La latence p95 dépasse 2s : {{ $value }}s."

      - alert: AFI_InstanceGone
        expr: count by (job) (up{job="afi-api"}) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Plus aucune instance AFI"

      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cible Prometheus injoignable : {{ $labels.instance }}"