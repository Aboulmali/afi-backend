apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: afi
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:2.9.8
          args:
            - -config.file=/etc/loki/loki.yaml
            - -config.expand-env=true
          ports:
            - containerPort: 3100
          env:
            - name: LOKI_BUCKET
              value: afi-uploads-481665100214
            - name: LOKI_AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: afi-secrets
                  key: aws_access_key_id
            - name: LOKI_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: afi-secrets
                  key: aws_secret_access_key
          volumeMounts:
            - name: config
              mountPath: /etc/loki
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: afi
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
