apiVersion: batch/v1
kind: CronJob
metadata:
  name: afi-db-backup
  namespace: afi
  labels:
    app: afi-db-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: backup
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  pg_dump "$DATABASE_URL" --format=custom --no-owner \
                    | gzip > /backups/afi-$STAMP.dump.gz
                  ls -1t /backups/afi-*.dump.gz | tail -n +8 | xargs -r rm -f
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: afi-secrets
                      key: database_url
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: false
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: afi-backups-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: afi-backups-pvc
  namespace: afi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi